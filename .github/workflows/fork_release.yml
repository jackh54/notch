name: "Fork Release"

# Publishes a DMG when a version tag is pushed, for example v2.7.3-agents.1.
# Upstream's release workflows need Apple signing secrets, so this one signs ad hoc.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Build and publish
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      PROJECT_NAME: boringNotch
      APP_NAME: Boring Notch
      XCODE_VERSION: "26.6"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version

      - name: Set version and build number
        run: |
          set -euo pipefail
          PBXPROJ="$PROJECT_NAME.xcodeproj/project.pbxproj"
          VERSION="${GITHUB_REF_NAME#v}"
          SOURCE_BUILD="$(python3 .github/scripts/extract_build_number.py \
            --pbxproj "$PBXPROJ" \
            --bundle-identifier theboringteam.boringnotch)"
          python3 .github/scripts/stamp_version.py \
            --pbxproj "$PBXPROJ" \
            --version "$VERSION" \
            --build-number "$SOURCE_BUILD.$GITHUB_RUN_NUMBER" \
            --info-plist "$PROJECT_NAME/Info.plist" \
            --update-channel stable
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build universal app
        run: |
          xcodebuild build -quiet \
            -project "$PROJECT_NAME.xcodeproj" \
            -scheme "$PROJECT_NAME" \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO

      - name: Sign ad hoc
        run: |
          set -euo pipefail
          mkdir -p Release
          ditto "build/Build/Products/Release/$APP_NAME.app" "Release/$APP_NAME.app"
          ./scripts/adhoc-sign.sh "Release/$APP_NAME.app"
          ARCHS="$(lipo -archs "Release/$APP_NAME.app/Contents/MacOS/$APP_NAME")"
          echo "Architectures: $ARCHS"
          [[ "$ARCHS" == *arm64* && "$ARCHS" == *x86_64* ]]

      - name: Create DMG
        run: |
          VENV_DIR="$RUNNER_TEMP/venv"
          python3 -m venv "$VENV_DIR"
          source "$VENV_DIR/bin/activate"
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install --require-hashes -r Configuration/dmg/requirements.txt
          ./Configuration/dmg/create_dmg.sh \
            "Release/$APP_NAME.app" \
            "Release/$PROJECT_NAME.dmg" \
            "$APP_NAME $VERSION"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          Boring Notch with the Agents tab for Claude Code and Codex. Works on Apple Silicon and Intel, macOS 14 or later.

          Open the DMG and move **Boring Notch** to Applications. The build isn't notarized, so clear the quarantine flag once before opening it:

          ```bash
          xattr -dr com.apple.quarantine "/Applications/Boring Notch.app"
          ```

          Don't use **Check for Updates** in the app: it points at upstream and replaces this fork. Get new versions from this page.
          NOTES
          gh release create "$GITHUB_REF_NAME" "Release/$PROJECT_NAME.dmg" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$APP_NAME $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"
